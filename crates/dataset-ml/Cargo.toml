[package]
name = "dataset-ml"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in machine learning dataset loaders"
readme = "README.md"
documentation = "https://docs.rs/dataset-ml"
keywords = ["dataset", "machine-learning", "iris", "titanic", "ndarray"]
categories = ["science"]

[features]
default = ["dataset", "preprocessing"]
dataset = ["dep:csv", "dep:serde", "dep:tempfile"]
preprocessing = []

[dependencies]
dataset-core = { workspace = true, features = ["utils"] }
ndarray = { workspace = true }
csv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
